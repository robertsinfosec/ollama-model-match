name: Release

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          # Date components: month and hour have NO leading zero
          # Day and minute ALWAYS have leading zero
          YY=$(date -u +%y)
          M=$(date -u +%-m)
          DD=$(date -u +%d)
          H=$(date -u +%-H)
          MM=$(date -u +%M)
          VERSION="v${YY}.${M}${DD}.${H}${MM}"

          BRANCH="${GITHUB_REF_NAME}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ "$BRANCH" != "main" ]]; then
            # Sanitize branch name for tag (replace / with -)
            SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')
            VERSION="${VERSION}-${SAFE_BRANCH}+${SHORT_SHA}"
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Create archive
        run: |
          cd src
          zip -r "../ollama-model-match-${{ steps.version.outputs.version }}.zip" . -x "results/*" "specs.yaml" "*.bak"
          cd ..

      - name: Create Release
