name: Bash Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python yq
        run: |
          python3 -m venv "$RUNNER_TEMP/yq-venv"
          "$RUNNER_TEMP/yq-venv/bin/pip" install yq==3.4.3
          echo "$RUNNER_TEMP/yq-venv/bin" >> "$GITHUB_PATH"
      - name: Run behavioral tests
        run: bash tests/run.sh
