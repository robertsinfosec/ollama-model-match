name: Bash Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        yq: [pinned, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Mike Farah yq
        run: |
          source src/lib/tools.sh
          install_yq
      - name: Install minimum supported yq for compatibility tests
        if: matrix.yq == 'minimum'
        run: |
          mkdir -p "$RUNNER_TEMP/yq-minimum"
          curl -fL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o "$RUNNER_TEMP/yq-minimum/yq"
          echo "a2c097180dd884a8d50c956ee16a9cec070f30a7947cf4ebf87d5f36213e9ed7  $RUNNER_TEMP/yq-minimum/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq-minimum/yq"
          echo "MODEL_MATCH_TEST_YQ=$RUNNER_TEMP/yq-minimum/yq" >> "$GITHUB_ENV"
      - name: Run behavioral tests
        run: bash tests/run.sh
